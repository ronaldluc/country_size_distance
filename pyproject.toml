[project]
name = "country-size-distance"
version = "0.1.0"
description = "Dataset builder and analysis tooling for country area vs distance from Brno."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "geopandas>=1.0.1",
  "pandas>=2.2.3",
  "pyproj>=3.7.1",
  "shapely>=2.1.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
